services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: r2dbc:mysql://db:3306/franquicia_db
      DB_USER: franquicia
      DB_PASSWORD: ${DB_PASSWORD:-local-dev-password}
      DB_INIT_MODE: always
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      MYSQL_DATABASE: franquicia_db
      MYSQL_USER: franquicia
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-dev-password}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  db_data:
