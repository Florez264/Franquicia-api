# Configurar estas variables en el proveedor de nube, sin secretos en Git.
spring.r2dbc.url=${DB_URL}
spring.r2dbc.username=${DB_USER}
spring.r2dbc.password=${DB_PASSWORD}
# TLS obligatorio. Para verificar también el certificado, configurar CA y VERIFY_IDENTITY.
spring.r2dbc.properties.sslMode=REQUIRED
spring.r2dbc.pool.initial-size=0
spring.r2dbc.pool.min-idle=0
spring.r2dbc.pool.max-size=3
spring.r2dbc.pool.max-idle-time=30s
spring.r2dbc.pool.max-acquire-time=15s
logging.level.root=INFO
spring.main.banner-mode=off
# El esquema en nube se administra con migraciones.
spring.sql.init.mode=never
