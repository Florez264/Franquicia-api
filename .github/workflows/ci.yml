name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.0'
      - name: Formato de Terraform
        run: terraform fmt -check -recursive
      - name: Inicializar proveedor sin backend
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validar infraestructura
        run: terraform validate

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Pruebas y empaquetado
        run: mvn -B -ntp clean verify
      - name: Comprobar imagen Docker
        run: docker build --tag franquicia-api:ci .
